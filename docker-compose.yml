services:
  audio-date-viewer:
    build: .
    container_name: audio-date-viewer
    restart: always
    ports:
      - "8085:80"
    volumes:
      - /mnt/nas_enrg/audio_mails:/var/www/html/audio_mails:ro
      - /var/cache/kyntus-audio:/var/cache/kyntus-audio
    command: >
      sh -c "test -d /var/www/html/audio_mails || { echo 'ERREUR: audio_mails non monte'; exit 1; };
      apache2-foreground"
