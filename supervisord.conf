[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ── Apache ──────────────────────────────────────────────────
[program:apache]
command=apache2-foreground
autostart=true
autorestart=true
startretries=5
stderr_logfile=/var/log/supervisor/apache_err.log
stdout_logfile=/var/log/supervisor/apache_out.log
priority=10

; ── Indexeur Audio (daemon toutes les 30 sec) ────────────────
[program:indexer]
command=php /var/www/html/indexer.php --daemon
directory=/var/www/html
autostart=true
autorestart=true
startretries=10
startsecs=5
stderr_logfile=/var/log/supervisor/indexer_err.log
stdout_logfile=/var/log/supervisor/indexer_out.log
priority=20
